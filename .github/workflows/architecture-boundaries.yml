name: architecture-boundaries

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    name: Enforce module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install architecture checker
        run: python -m pip install "import-linter==2.15"
      - name: Enforce declared module boundaries
        env:
          PYTHONPATH: src
        run: lint-imports --config .importlinter
