name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev,ci-tests,operator,filesystem-events,browser,database,scheduler,sandbox,audio,vision,telemetry]"
      - name: Install SearXNG capability pack
        run: python -m pip install -e ./packs/searxng-search
      - name: Install Jina Reader capability pack
        run: python -m pip install -e ./packs/jina-reader
      - name: Run all tests
        run: python -m pytest -q
      - name: Run capability pack tests
        run: python -m pytest -q packs/searxng-search/tests packs/jina-reader/tests
