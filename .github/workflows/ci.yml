name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    name: Platform boundary suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Boundary guards and platform contracts
        run: >
          python -m pytest -q
          tests/test_platform_boundaries.py
          tests/test_agent_platform_foundation.py
          tests/test_extension_governance.py
          tests/test_contract_v1.py

  regression:
    name: Full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev,ci-tests,operator,filesystem-events,browser,database,scheduler,sandbox,audio,vision,telemetry]"
      - name: Install SearXNG capability pack
        run: python -m pip install -e ./packs/searxng-search
      - name: Install Jina Reader capability pack
        run: python -m pip install -e ./packs/jina-reader
      - name: Run all tests
        run: python -m pytest -q
      - name: Run capability pack tests
        run: python -m pytest -q packs/searxng-search/tests packs/jina-reader/tests
