name: Finalize Runtime release gate

on:
  push:
    branches:
      - feat/v0.3-learning

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-learning
          fetch-depth: 1

      - name: Apply exact release-gate metadata patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lock = Path("uv.lock")
          text = lock.read_text()
          old = '{ name = "openai-codex", marker = "extra == \'codex\'" },'
          new = '{ name = "openai-codex", marker = "extra == \'codex\'", specifier = "==0.147.0" },'
          if text.count(old) != 1:
              raise SystemExit(f"unexpected uv.lock match count: {text.count(old)}")
          lock.write_text(text.replace(old, new))

          todo = Path("docs/agent-platform-todo.md")
          text = todo.read_text()
          old = '''- [ ] Run an opt-in real SDK smoke test in an authorized disposable workspace
                and record the verified `openai-codex` version constraint in
                `pyproject.toml`; until then the dependency stays intentionally
                unconstrained.'''
          new = '''- [x] Run an opt-in real SDK smoke test in an authorized disposable workspace;
                verified `openai-codex==0.147.0` and pinned that exact version in
                `pyproject.toml` and the lock metadata.'''
          if text.count(old) != 1:
              raise SystemExit(f"unexpected TODO match count: {text.count(old)}")
          todo.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- uv.lock docs/agent-platform-todo.md

      - name: Commit exact release-gate metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock docs/agent-platform-todo.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record verified Codex release gate"
          git push origin HEAD:feat/v0.3-learning
