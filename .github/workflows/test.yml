name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,operator,filesystem-events,browser,database,scheduler,sandbox,audio,vision,telemetry]'
      - run: pip install -e ./packs/searxng-search
      - run: pip install -e ./packs/jina-reader
      - run: python -m pytest -q
      - run: python -m pytest -q packs/searxng-search/tests packs/jina-reader/tests
