[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-pack-searxng"
version = "1.0.0"
description = "SearXNG web.search capability pack for Agent Runtime"
requires-python = ">=3.11"
dependencies = [
    "agent-runtime>=0.3,<1.0",
    "httpx>=0.28,<1",
]

[project.entry-points."agent_runtime.capability_packs"]
searxng-search = "runtime_searxng_pack:build_pack"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime_searxng_pack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
