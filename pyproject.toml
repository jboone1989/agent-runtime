[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.3.0"
description = "A persistent runtime for autonomous agents — continuity of self, viability, endogenous goals."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "dulwich>=0.24,<0.25",
    "httpx>=0.28,<1",
    "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
memory = ["tiktoken>=0.8,<1"]
memory-graph = ["graphiti-core==0.30.2"]
memory-documents = ["llama-index-core==0.14.25"]
memory-content = ["psycopg[binary]==3.3.6", "pgvector==0.5.0", "jieba==0.42.1"]
virtualbrain = []
network = []
codex = ["openai-codex==0.147.0"]
mcp = ["mcp>=2,<3"]
documents = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.3,<0.2"]
secrets = ["keyring>=25,<26"]
filesystem-events = ["watchdog>=6,<7"]
browser = ["playwright>=1.62,<2"]
database = ["SQLAlchemy>=2.0.52,<2.1"]
scheduler = ["APScheduler>=3.11.3,<4"]
sandbox = ["e2b-code-interpreter>=2.9.1,<3"]
audio = ["faster-whisper>=1.2.1,<2"]
vision = ["paddleocr>=3.7,<4", "paddlepaddle>=3.3.1,<4"]
telemetry = ["opentelemetry-api>=1.44,<2"]
operator = [
    "apprise",
    "wecom-aibot-python-sdk",
]

[project.scripts]
agent-runtime = "agent_runtime.__main__:main"
agent-runtime-chat = "agent_runtime.communication.server:main"
agent-runtime-operator = "agent_runtime.communication.operator.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_runtime/config/default.yaml" = "agent_runtime/config/default.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
