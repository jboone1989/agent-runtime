[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime"
version = "0.3.0"
description = "A persistent runtime for autonomous agents — continuity of self, viability, endogenous goals."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    "dulwich>=0.24,<0.25",
    "httpx>=0.28,<1",
    "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
virtualbrain = []
network = []
codex = ["openai-codex"]
operator = [
    "apprise",
    "wecom-aibot-python-sdk",
]

[project.scripts]
agent-runtime = "agent_runtime.__main__:main"
agent-runtime-chat = "agent_runtime.communication.server:main"
agent-runtime-operator = "agent_runtime.communication.operator.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_runtime/config/default.yaml" = "agent_runtime/config/default.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
